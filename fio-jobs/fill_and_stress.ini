###=====================================================================###
# fill_and_stress: overload a ~60TB cluster, then keep hitting it.
#
# Phase 1 — sequential write of ~64TiB incompressible data (overshoots a
#           "60TB" cluster so usable capacity is exhausted).
# Phase 2 — 24h random overwrite on the same files (stress after full /
#           ENOSPC). continue_on_error keeps the job alive past ENOSPC.
#
# Linux / file (NFS mount). Match other fio-jobs profiles.
# Run directly (do not use runfio.sh -s — it would clobber sizing):
#   mkdir -p /mount/vast/fio
#   fio ./fill_and_stress.ini --directory=/mount/vast/fio
#
# DANGER: Will fill the cluster. Lab / repro only. Not for customer POCs
#         unless that is the explicit goal (e.g. ORION-383928 path).
###=====================================================================###

[global]
ioengine=libaio
direct=1
invalidate=1
group_reporting=1
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
fallocate=none
create_on_open=1
create_serialize=0
continue_on_error=all
directory=/mount/vast/fio
filename=fill_and_stress

# Per-job file set: 8 jobs × 64 files × 128GiB = 64TiB total
numjobs=8
nrfiles=64
filesize=128G

[1_fill_seq_64tib]
description=Sequential fill ~64TiB (exhaust ~60TB cluster)
rw=write
bs=1m
iodepth=32

[2_stress_rand_24h]
stonewall
description=Random overwrite stress for 24h after fill / ENOSPC
rw=randwrite
bs=1m
iodepth=64
time_based=1
runtime=86400
file_service_type=random
