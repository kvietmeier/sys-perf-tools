; Dual-path link saturation (Linux block / NVMe or NVMe-oF)
;
; Goal: load two independent data paths in parallel toward theoretical line rate
;   (e.g. 2x100 GbE ≈ 25 GB/s, 2x200 GbE ≈ 50 GB/s L2 ceilings — not guarantees).
;
; Prerequisites:
;   1) Two independent paths (distinct local IP / fabric path per NIC port)
;   2) Two separate namespaces / block devices (edit filenames below)
;   3) cpus_allowed / numa_cpu_nodes set to CPUs local to the NIC PCIe slot
;      (both ports on a dual-port card share that one NUMA node)
;
; WARNING: Destructive to the target devices. Confirm /dev/nvme* names first.
; Both job sections run concurrently (no stonewall).
; Unlike other jobs in this folder, this targets raw block devices — not directory=.
; Do not use ./runfio.sh -d/-f; edit the INI and run fio directly.
; See README for Windows block / other platform adapt.

[global]
direct=1
ioengine=libaio
group_reporting=1
time_based=1
runtime=300
ramp_time=15
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0

; Large sequential blocks for link saturation (not IOPS)
rw=read
bs=1M

; 32 QD x 8 jobs = 256 outstanding I/Os per target
iodepth=32
numjobs=8

; Limit how much of each raw device is exercised
size=50G

; Pin to CPUs local to the NIC PCIe slot (example: NUMA 0 → CPUs 0-15).
; Update after checking NIC NUMA affinity (e.g. cat /sys/class/net/<nic>/device/numa_node).
; Linux also supports numa_cpu_nodes=0 as an alternative to cpus_allowed.
cpus_allowed=0-15
cpus_allowed_policy=shared

; ------------------------------------------------------------------------------
; Path 1 → block target A
; ------------------------------------------------------------------------------
[port1-throughput]
filename=/dev/nvme0n1

; ------------------------------------------------------------------------------
; Path 2 → block target B
; ------------------------------------------------------------------------------
[port2-throughput]
filename=/dev/nvme1n1
