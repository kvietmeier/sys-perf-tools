###=====================================================================###
# VAST AI Workload Benchmark Profile (Linux / file)
# AI/ML patterns: DataLoader ingest, KV cache, LLM checkpoint, RAG search.
# Override: ./runfio.sh -d /mount/vast/fio  [-f bench] [-s 100G]
# WARNING: Creates/overwrites large files under directory=.
###=====================================================================###
[global]
ioengine=libaio
direct=1
invalidate=1
group_reporting=1
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
time_based=1
runtime=300
ramp_time=30
directory=/mount/vast/fio
filename=bench
size=100G
write_bw_log=ai_benchmark
write_lat_log=ai_benchmark
write_iops_log=ai_benchmark
log_avg_msec=1000

[1_128k_seq_read_dataloader]
description=128K Sequential Read - Standard Vision/Multimodal Training Batch Read
bs=128k
rw=read
iodepth=32
numjobs=8

[2_4k_rand_read_kv_cache]
stonewall
description=4K Random Read - LLM Inference KV Cache Retrieval & Vector Lookups
bs=4k
rw=randread
iodepth=128
numjobs=16

[3_1m_seq_write_llm_checkpoint]
stonewall
description=1MB Sequential Write - LLM Checkpoint Dump (Burst Bandwidth)
bs=1M
rw=write
iodepth=16
numjobs=8

[4_4m_seq_write_checkpoint_drain]
stonewall
description=4MB Sequential Write - Sustained VAST Shared Buffer Drain
bs=4M
rw=write
iodepth=8
numjobs=4

[5_8k_rand_read_low_latency_inference]
stonewall
description=8K Random Read - High-Concurrency Sub-Millisecond Inference SLAs
bs=8k
rw=randread
iodepth=16
numjobs=32

[6_16k_rand_mixed_RAG_embeddings]
stonewall
description=16K Random 80/20 Mixed - Vector Index Graph Updates & RAG Ingestion
bs=16k
rw=randrw
rwmixread=80
iodepth=64
numjobs=16

[7_4k_rand_write_kv_spillover_worst]
stonewall
description=4K Random Write - Context Window Spillover & Cache Thrashing
bs=4k
rw=randwrite
iodepth=256
numjobs=16

[8_mixed_block_multimodal_stress]
stonewall
description=Variable Block Size (4K-2M) Random Read/Write - Concurrent Training & Inference
bsrange=4k-2M
rw=randrw
rwmixread=60
iodepth=128
numjobs=16
