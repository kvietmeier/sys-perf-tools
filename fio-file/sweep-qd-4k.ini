###================= VAST FIO Queue Scaling (P-02) ===================###
# Isolates iodepth / numjobs scaling for Linux file clients (NFS/SMB/local).
# Override: ./runfio.sh -d /mount/vast/fio  [-f bench] [-s 100G]
# WARNING: Creates/overwrites large files under directory=.
###===================================================================###

[global]
ioengine=libaio
direct=1
invalidate=1
group_reporting=1
rw=randread
bs=4k
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
directory=/mount/vast/fio
filename=bench
size=100G
time_based=1
runtime=60

[QD_Sweep_Depth_1]
iodepth=1
numjobs=1

[QD_Sweep_Depth_32]
stonewall
iodepth=32
numjobs=4

[QD_Sweep_Depth_128]
stonewall
iodepth=128
numjobs=8
