###=========== VAST Steady-State Infrastructure Validation ===========###
# Environmental tests under sustained load against a file mount.
# Override: ./runfio.sh -d /mnt/vast/fio  [-f bench] [-s 100G]
# WARNING: Creates/overwrites large files under directory=.
###===================================================================###

[global]
ioengine=libaio
direct=1
invalidate=1
group_reporting=1
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
directory=/mnt/vast/fio
filename=bench
size=100G
time_based=1
runtime=600

[Steady_State_Mixed_Workload]
rw=randrw
rwmixread=70
bs=8k
iodepth=64
numjobs=8

[Steady_State_Streaming_Load]
stonewall
rw=read
bs=1m
iodepth=16
numjobs=4
