###=====================================================================###
# VAST Enterprise Workload Benchmark Profile (Linux / file)
# Mixed enterprise profiles: SQL OLTP, VDI, media streaming, backup.
# Override: ./runfio.sh -d /mnt/vast/fio  [-f bench] [-s 100G]
# WARNING: Creates/overwrites large files under directory=.
###=====================================================================###

[global]
ioengine=libaio
direct=1
invalidate=1
group_reporting=1
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
time_based=1
runtime=300
ramp_time=30
directory=/mnt/vast/fio
filename=bench
size=100G
write_bw_log=vast_benchmark
write_lat_log=vast_benchmark
write_iops_log=vast_benchmark
log_avg_msec=1000

[1_4k_rand_read_4k_cluster]
description=4K Random Read - Latency Baseline & Max IOPS
bs=4k
rw=randread
iodepth=64
numjobs=8

[2_8k_rand_mixed_database]
stonewall
description=8K Random 70/30 - OLTP DB Simulation
bs=8k
rw=randrw
rwmixread=70
iodepth=32
numjobs=8

[3_4k_rand_write_worst_case]
stonewall
description=4K Random Write 100% - Array Metadata Stress & Garbage Collection
bs=4k
rw=randwrite
iodepth=128
numjobs=16

[4_64k_seq_read_streaming]
stonewall
description=64K Sequential Read - Media Streaming & VDI Boot Storm
bs=64k
rw=read
iodepth=32
numjobs=4

[5_1m_seq_write_backup]
stonewall
description=1MB Sequential Write - High Bandwidth Ingest & Backup Load
bs=1M
rw=write
iodepth=16
numjobs=4

[6_1m_seq_read_max_bw]
stonewall
description=1MB Sequential Read - Max Fabric & Controller Throughput
bs=1M
rw=read
iodepth=16
numjobs=8

[7_mixed_block_pathological]
stonewall
description=Mixed Variable Block Size Random I/O - Direct QD Saturation
bsrange=4k-128k
rw=randrw
rwmixread=50
iodepth=256
numjobs=16
