###================ VAST FIO Baseline (P-01 / P-06 / P-09) ===============###
# Block-size spectrum: 4K IOPS, 64K max transfer, 1M AI streaming.
# Latency percentiles for P-09 via write_lat_log.
# Target placeholder: \\.\PhysicalDriveX  (override: runfio.ps1 -Filename)
# WARNING: Destructive to the target drive.
###=======================================================================###

[global]
ioengine=windowsaio
direct=1
thread=1
invalidate=1
group_reporting=1
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
filename=\\.\PhysicalDriveX
time_based=1
runtime=120
ramp_time=30
write_lat_log=ai_latency

[4K_Random_Read_IOPS]
rw=randread
bs=4k
iodepth=32
numjobs=8

[4K_Random_Write_IOPS]
stonewall
rw=randwrite
bs=4k
iodepth=32
numjobs=8

[64K_Sequential_Read_MaxTransfer]
stonewall
rw=read
bs=64k
iodepth=16
numjobs=4

[1M_Sequential_Read_AI_Profile]
stonewall
rw=read
bs=1m
iodepth=8
numjobs=4

[1M_Sequential_Write_Throughput]
stonewall
rw=write
bs=1m
iodepth=8
numjobs=4
