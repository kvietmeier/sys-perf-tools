###=========== VAST Steady-State Infrastructure Validation ===========###
# P-03, P-04, P-05, P-07, P-08, P-10 environmental tests
# (MPIO policies, RDMA vs TCP, QoS, CPU overhead) under sustained load.
# Target placeholder: \\.\PhysicalDriveX  (override: runfio.ps1 -Filename)
# WARNING: Destructive to the target drive.
###===================================================================###

[global]
ioengine=windowsaio
direct=1
thread=1
invalidate=1
group_reporting=1
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
filename=\\.\PhysicalDriveX
time_based=1
runtime=600

[Steady_State_Mixed_Workload]
rw=randrw
rwmixread=70
bs=8k
iodepth=64
numjobs=8

[Steady_State_Streaming_Load]
stonewall
rw=read
bs=1m
iodepth=16
numjobs=4
