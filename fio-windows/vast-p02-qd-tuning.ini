###================= VAST FIO Queue Scaling (P-02) ===================###
# Isolates iodepth / numjobs scaling for Windows NVMe-oF hosts.
# Target placeholder: \\.\PhysicalDriveX  (override: runfio.ps1 -Filename)
# WARNING: Destructive to the target drive.
###===================================================================###

[global]
ioengine=windowsaio
direct=1
thread=1
invalidate=1
group_reporting=1
rw=randread
bs=4k
refill_buffers=1
randrepeat=0
buffer_compress_percentage=0
dedupe_percentage=0
filename=\\.\PhysicalDriveX
time_based=1
runtime=60

[QD_Sweep_Depth_1]
iodepth=1
numjobs=1

[QD_Sweep_Depth_32]
stonewall
iodepth=32
numjobs=4

[QD_Sweep_Depth_128]
stonewall
iodepth=128
numjobs=8
